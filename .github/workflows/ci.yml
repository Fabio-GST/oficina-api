# Integração Contínua: lint, typecheck, testes e build a cada PR/push.
name: CI

on:
  pull_request:
  push:
    branches: [homolog, main]

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # test:ci chama o entrypoint do Japa diretamente — o wrapper `node ace
      # test` retorna exit code errado em alguns ambientes. Os testes usam
      # SQLite em memória (.env.test), sem serviços externos.
      - name: Testes (unit + integration + functional)
        run: npm run test:ci

      - name: Build da aplicação
        run: npm run build

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: oficina-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifestos:
    name: Validar manifestos Kubernetes (Kustomize)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4

      - name: Renderizar overlays hml e prod
        run: |
          for amb in hml prod; do
            echo "== overlays/$amb"
            kubectl kustomize "k8s/overlays/$amb" > "/tmp/$amb.yaml"
            grep -q "namespace: oficina-$amb" "/tmp/$amb.yaml"
            grep -q "aws-load-balancer-type: nlb" "/tmp/$amb.yaml"
          done
