sonar.projectKey=oficina-backend
sonar.projectName=Oficina Mecanica - Backend

# Código-fonte e testes
sonar.sources=app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts

# Exclusões: build, dependências, migrations e os próprios specs
sonar.exclusions=build/**,node_modules/**,database/migrations/**,**/*.spec.ts

# Cobertura (lcov gerado por `npm run coverage:sonar`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
