# MODELO de Secret — copie para `secret.yaml` (ignorado pelo git), troque os
# valores e aplique:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# No CI/CD o Secret é criado a partir dos GitHub Secrets (ver .github/workflows).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
stringData:
  APP_KEY: 'troque-por-32-caracteres-aleatorios'
  JWT_SECRET: 'troque-este-segredo-em-producao'
  WEBHOOK_SECRET: 'troque-este-segredo-de-webhook'
  DB_PASSWORD: 'troque-a-senha-do-banco'
  MYSQL_ROOT_PASSWORD: 'troque-a-senha-do-banco'
  # Necessários apenas com NOTIFICACAO_DRIVER=email:
  SMTP_HOST: ''
  SMTP_PORT: '587'
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  MAIL_FROM: 'oficina@exemplo.com'
  EMAIL_ALMOXARIFE: ''
