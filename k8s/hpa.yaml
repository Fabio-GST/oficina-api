# Escala a API conforme o consumo de CPU/memória dos pods.
# Requer o metrics-server instalado no cluster (ver k8s/README.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-api
  namespace: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Evita "flapping" na demonstração: espera 60s antes de reduzir réplicas.
      stabilizationWindowSeconds: 60
