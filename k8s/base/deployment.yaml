# API da oficina. A imagem é publicada pelo CD no GHCR; a tag é fixada pelo
# overlay/pipeline (`kustomize edit set image`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: api
          image: ghcr.io/fabio-gst/oficina-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          # Readiness consulta o banco (RDS): o pod só recebe tráfego do NLB
          # quando consegue falar com o MySQL. Liveness é só o processo.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          # Requests/limits são OBRIGATÓRIOS para o HPA calcular a utilização e
          # para a ResourceQuota do namespace (criada pelo repo oficina-infra-k8s).
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # usuário "node" da imagem base (UID numérico p/ o kubelet validar)
            allowPrivilegeEscalation: false
