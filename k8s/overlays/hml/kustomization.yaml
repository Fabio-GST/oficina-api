# Homologação: branch `homolog` → namespace `oficina-hml` (criado pelo repo
# oficina-infra-k8s). O CD troca a tag da imagem pelo SHA do commit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-hml

labels:
  - includeSelectors: false
    pairs:
      oficina/ambiente: hml

resources:
  - ../../base

images:
  - name: ghcr.io/fabio-gst/oficina-api
    newTag: hml

patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
