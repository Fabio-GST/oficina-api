# Configuração NÃO sensível da API. Segredos (senhas, chaves, tokens) ficam no
# Secret (ver secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina
data:
  TZ: 'UTC'
  NODE_ENV: 'production'
  HOST: '0.0.0.0'
  PORT: '3333'
  LOG_LEVEL: 'info'
  DB_CONNECTION: 'mysql'
  DB_HOST: 'mysql'
  DB_PORT: '3306'
  DB_USER: 'root'
  DB_DATABASE: 'oficina'
  JWT_EXPIRES_IN: '1h'
  # "log" registra as notificações no stdout; "email" envia via SMTP
  # (credenciais no Secret).
  NOTIFICACAO_DRIVER: 'log'
