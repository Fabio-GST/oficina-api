# Stack de análise de qualidade (SonarQube). Separada do runtime da aplicação.
#
# Uso:
#   docker compose -f docker-compose.sonar.yml up -d sonarqube sonar-db
#   npm run coverage:sonar          # gera coverage/lcov.info
#   export SONAR_TOKEN=<token>      # (PowerShell: $env:SONAR_TOKEN="<token>")
#   npm run sonar                   # roda o scanner
services:
  sonar-db:
    image: postgres:15-alpine
    container_name: oficina-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data
    networks:
      - sonarnet

  sonarqube:
    image: sonarqube:lts-community
    container_name: oficina-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - sonarnet

  # Scanner sob demanda: `docker compose -f docker-compose.sonar.yml --profile scan run --rm scanner`
  scanner:
    image: sonarsource/sonar-scanner-cli
    container_name: oficina-sonar-scanner
    profiles: ['scan']
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    working_dir: /usr/src
    volumes:
      - .:/usr/src
    networks:
      - sonarnet

volumes:
  sonar_pgdata:
  sonar_data:
  sonar_extensions:
  sonar_logs:

networks:
  sonarnet:
    name: sonarnet
